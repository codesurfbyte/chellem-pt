name: Claude — CodeRabbit 리뷰 자동 반영

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

jobs:
  claude-address-review:
    # CodeRabbit 봇 리뷰/코멘트에만 반응
    if: |
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login == 'coderabbitai[bot]' &&
       github.event.review.state == 'changes_requested') ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == 'coderabbitai[bot]' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'Actionable comments posted'))

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PR 브랜치를 체크아웃
          ref: ${{ github.event.pull_request.head.ref || github.event.issue.pull_request.url && 'HEAD' }}

      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            CodeRabbit이 이 PR에 코드 리뷰를 남겼습니다.
            PR의 CodeRabbit 리뷰 코멘트(인라인 포함)를 모두 확인하고,
            실제로 수정이 필요한 지적사항을 코드에 반영해주세요.

            작업 순서:
            1. PR 리뷰 코멘트에서 "Actionable comments"를 파악한다
            2. 각 지적사항에 대해 파일을 읽고 문제를 이해한다
            3. 수정이 타당한 경우 코드를 수정한다 (의견 불일치 시 코멘트로 이유를 남긴다)
            4. 수정 완료 후 변경 내용을 커밋한다

            주의: 빌드를 깨는 변경은 하지 말 것. 수정 후 타입 오류가 없는지 확인할 것.
